name: Release Plasma Widget

on:
  push:
    tags: ["v*"]
  # Manual runs from a branch build a test package only; releases come from v* tags
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package files
        run: |
          test -f metadata.json
          test -d contents
          test -f LICENSE || test -f LICENSE.md || test -f LICENSE.txt

      - name: Package widget
        id: package
        shell: bash
        run: |
          # metadata.json is the source of truth for the version
          VERSION="$(jq -r '.KPlugin.Version' metadata.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::metadata.json has no KPlugin.Version"
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match metadata.json version ${VERSION} (expected v${VERSION})"
              exit 1
            fi
          else
            # Not a release: mark the test package with the commit
            VERSION="${VERSION}-${GITHUB_SHA::7}"
          fi

          ARCHIVE="unified-system-monitor-${VERSION}.plasmoid"

          mkdir -p dist

          zip -r "dist/${ARCHIVE}" \
            metadata.json contents LICENSE \
            -x '*/.*' '*.qmlc' '*.jsc'

          echo "archive=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-system-monitor-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.archive }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Unified System Monitor ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
