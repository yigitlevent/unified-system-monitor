name: Release Plasma Widget

# Every push to main releases automatically when metadata.json has a version that
# hasn't been released yet (no v<version> tag). Otherwise it only builds a test package.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package files
        run: |
          test -f metadata.json
          test -d contents
          test -f LICENSE || test -f LICENSE.md || test -f LICENSE.txt

      - name: Package widget
        id: package
        shell: bash
        run: |
          # metadata.json is the source of truth for the version
          VERSION="$(jq -r '.KPlugin.Version' metadata.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::metadata.json has no KPlugin.Version"
            exit 1
          fi

          TAG="v${VERSION}"
          if [ "$GITHUB_REF_NAME" = "main" ] && [ -z "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            RELEASE=true
            echo "New version ${VERSION}: releasing as ${TAG}"
          else
            RELEASE=false
            # Already released (or not on main): mark the test package with the commit
            echo "${TAG} already exists or not on main: building a test package only"
            VERSION="${VERSION}-${GITHUB_SHA::7}"
          fi

          ARCHIVE="unified-system-monitor-${VERSION}.plasmoid"

          mkdir -p dist

          zip -r "dist/${ARCHIVE}" \
            metadata.json contents LICENSE \
            -x '*/.*' '*.qmlc' '*.jsc'

          echo "archive=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release=${RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-system-monitor-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.archive }}

      - name: Publish GitHub Release
        if: steps.package.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # Creates the tag on this commit
          tag_name: ${{ steps.package.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Unified System Monitor ${{ steps.package.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
