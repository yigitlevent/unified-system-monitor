name: Release Plasma Widget

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate package files
        run: |
          test -f metadata.json
          test -d contents
          test -f LICENSE || test -f LICENSE.md || test -f LICENSE.txt

      - name: Package widget
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="unified-system-monitor-${VERSION}.plasmoid"

          mkdir -p dist

          zip -r "dist/${ARCHIVE}" \
            metadata.json contents LICENSE \
            -x '*/.*' '*.qmlc' '*.jsc'

          echo "archive=dist/${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: unified-system-monitor-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.archive }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Unified System Monitor ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
